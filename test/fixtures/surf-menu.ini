;
;	Menu System - Конфигурация системы меню для SURF
;

[Основное]
PREFIX = SC_CHAT_PREFIX

KEY = {
	EXIT = SC_MENU_EXIT
	BACK = SC_MENU_BACK
	NEXT = SC_MENU_NEXT
	NUMBER = SC_MENU_NUMBER
	DISABLED = SC_MENU_NUMBER_DISABLED
	PAGE = SC_MENU_PAGE
	TIME = SC_MENU_TIME
}

[MAIN_MENU]
TITLE = SC_MENU_MAIN_TITLE
HIDE_BACK = YES

ITEMS = {
	; Ключ перевода | Плейсхолдер | Условие | Действие | Ограничение | Сообщение | Пропуск
	"SC_MENU_MAIN_RESET_SCORE" "" "" "RESET_SCORE" "" "" ""
	"SC_MENU_MAIN_ADMIN" "" "ACCESS_ADMIN" "SHOW_ADMIN_MENU" "ADMIN" "" ""
	"SC_MENU_MAIN_SPECTATE|SC_MENU_MAIN_JOIN" "" "!IS_SPECTATOR|IS_SPECTATOR" "JOIN_SPECTATE|JOIN_TEAM" "" "" ""
}

[ADMIN_MENU]
TITLE = SC_MENU_ADMIN_TITLE
ACTIVE_ON = ACCESS_ADMIN

ITEMS = {
    "SC_MENU_ADMIN_DM_MODE" "%dm_status%" "" "TOGGLE_DM" "ADMIN" "" ""
    "SC_MENU_ADMIN_CONFIG" "" "" "SHOW_LIST_ADMIN_CONFIG_MENU" "ADMIN" "" ""
    "SC_MENU_ADMIN_ZONE" "" "" "SHOW_ZONE_ADMIN_MENU" "ADMIN" "" ""
    "SC_MENU_ER_TITLE" "" "" "SHOW_ENT_REMOVER_MENU" "ADMIN" "" ""
}

[ZONE_ADMIN_MENU]
TITLE = SC_ZONE_MENU_TITLE
ACTIVE_ON = ACCESS_ADMIN

; ITEMS format: "Name" "Placeholder" "Condition" "Action" "Restriction" "RestrictionMsg"
ITEMS = {
    "SC_ZONE_ITEM_NAME" "%zone_name%" "" "SHOW_LIST_ZONE_MENU" "ADMIN" "" "1"
    "SC_ZONE_ITEM_POINT_A" "%point_a%" "" "SET_POINT_A" "ADMIN" ""
    "SC_ZONE_ITEM_POINT_B" "%point_b%" "" "SET_POINT_B" "ADMIN" ""
    "SC_ZONE_ITEM_PREVIEW" "%preview_status%" "" "TOGGLE_PREVIEW" "ADMIN" ""
    "SC_ZONE_ITEM_SAVE" "" "" "SAVE_ZONE" "ADMIN" "" "1"
    "SC_ZONE_ITEM_SETTINGS" "" "HAS_SELECTED_ZONE" "SHOW_LIST_ZONE_SETTINGS_MENU" "ADMIN" ""
    "SC_ZONE_ITEM_DELETE" "" "" "DELETE_LAST" "ADMIN" ""
}

[LIST_ZONE_SETTINGS_MENU]
TITLE = SC_ZONE_SETTINGS_TITLE
ACTIVE_ON = ACCESS_ADMIN

VIEW = {
    "%item_name% %setting_status%" "" "TOGGLE_SETTING" "ADMIN" ""
}

[LIST_ZONE_MENU]
TITLE = SC_ZONE_LIST_TITLE
ACTIVE_ON = ACCESS_ADMIN

FILTER = {
    "HAS_ZONES" "SC_ZONE_LIST_EMPTY"
}

VIEW = {
    "%zone_name%" "" "EDIT_ZONE" "ADMIN" ""
}

[LIST_ADMIN_CONFIG_MENU]
TITLE = SC_MENU_CONFIG_TITLE

; Формат: "Name" "Condition" "Action" "Restriction" "RestrictionMsg"
VIEW = {
	"%cvar%" "" "INPUT_SETTINGS" "ADMIN" ""
}

[ENT_REMOVER_MENU]
TITLE = SC_MENU_ER_TITLE
ACTIVE_ON = ACCESS_ADMIN

ITEMS = {
    "SC_MENU_ER_DELETE_AIM" "" "" "ER_DELETE_AIM" "ADMIN" ""
    "SC_MENU_ER_SET_POINT_A" "" "" "ER_SET_POINT_A" "ADMIN" ""
    "SC_MENU_ER_SET_POINT_B" "" "" "ER_SET_POINT_B" "ADMIN" ""
    "SC_MENU_ER_DELETE_ZONE" "" "ER_HAS_POINTS" "ER_DELETE_ZONE" "ADMIN" ""
    "SC_MENU_ER_NOCLIP" "%er_noclip%" "" "ER_TOGGLE_NOCLIP" "ADMIN" ""
    "SC_MENU_ER_LIST" "" "" "SHOW_LIST_ER_ENTITIES_MENU" "ADMIN" ""
}

[LIST_ER_ENTITIES_MENU]
TITLE = SC_MENU_ER_LIST_TITLE
ACTIVE_ON = ACCESS_ADMIN

VIEW = {
    "%item_name%" "" "ER_RESTORE" "ADMIN" "SC_MENU_ER_RESTORE"
}
